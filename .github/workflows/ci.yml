name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-24.04
    container: python:3.15-slim
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends doxygen shellcheck
          pip install --no-cache-dir --disable-pip-version-check -r tools/requirements-dev.txt
      - name: pylint
        # Tests reach into the modules they test. tests/unit/fixtures holds no __init__.py, so pylint
        # reaches it only by name.
        run: |
          pylint --rcfile pyproject.toml brew_ports tools/check_docs.py
          pylint --rcfile pyproject.toml --disable=protected-access tests tests/unit/fixtures
      - name: mypy
        run: mypy --config-file pyproject.toml
      - name: Doc blocks
        run: python3 -I tools/check_docs.py brew_ports tests
      - name: Doxygen
        run: |
          mkdir -p build
          doxygen docs/Doxyfile
      - name: shellcheck
        run: shellcheck brew-ports tools/*.sh

  actionlint:
    name: workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Interpreter
        run: tools/fetch-python.sh "$(uname -m)" build/python
      - name: Unit tests
        run: build/python/bin/python3 -B -m unittest discover -s tests/unit -t . -v
      - name: Bundle
        run: |
          tools/build-release.sh "$(uname -m)"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/brew-ports-*-macos-"$(uname -m)".tar.gz -C "$RUNNER_TEMP/bundle" --strip-components 1
          "$RUNNER_TEMP/bundle/bin/brew-ports" --help

  # Both migration jobs start from the same mixed host: MacPorts base from the
  # signed package, three ports, and three formulae beside the runner's Homebrew.
  ports-to-brew:
    name: integration (ports to brew)
    needs: unit
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          tools/build-release.sh "$(uname -m)"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/brew-ports-*-macos-"$(uname -m)".tar.gz -C "$RUNNER_TEMP/bundle" --strip-components 1
          echo "$RUNNER_TEMP/bundle/bin" >> "$GITHUB_PATH"
      - name: Install MacPorts base
        run: brew-ports bootstrap-ports --yes
      - name: Mixed host
        run: |
          sudo /opt/local/bin/port -N -b install jq gsed wget
          brew install wget tree jq
      - name: scan
        run: brew-ports scan --json > scan.out.json
      - name: doctor (a report, and the exit line when the status is 1)
        run: |
          code=0; brew-ports doctor > doctor.out.txt || code=$?
          cat doctor.out.txt
          test "$code" -le 1
          grep -q '^Checked ' doctor.out.txt
          if [ "$code" -eq 1 ]; then tail -n 1 doctor.out.txt | grep -q '^Exit status 1: '; fi
          code=0; brew-ports doctor --fix --dry-run > doctor.dry.txt || code=$?
          cat doctor.dry.txt
          test "$code" -le 1
          grep -q '^Checked ' doctor.dry.txt
          grep -q '^Dry run: nothing changes\.$' doctor.dry.txt
          if [ "$code" -eq 1 ]; then tail -n 1 doctor.dry.txt | grep -q '^Exit status 1: '; fi
      - name: doctor --json (exit 1 exactly when a finding stops a move or is broken)
        run: |
          code=0; brew-ports doctor --json > doctor.out.json || code=$?
          problems="$(jq '[.issues[] | select(.severity >= 3 or (.blocks | length) > 0)] | length' doctor.out.json)"
          echo "exit status $code; $problems findings stop a move or are broken"
          if [ "$problems" -gt 0 ]; then test "$code" -eq 1; else test "$code" -eq 0; fi
      - name: recommend (exit 1 expected, both managers hold packages)
        run: |
          code=0; brew-ports recommend --json > recommend.out.json || code=$?
          test "$code" -eq 1
      - name: plan
        run: brew-ports plan --target brew --only jq,gsed --yes --out plan.json
      - name: apply --dry-run
        run: brew-ports apply plan.json --dry-run
      - name: apply
        run: brew-ports apply plan.json --yes
      - name: verify
        run: brew-ports verify plan.json
      - name: The ports are replaced, the rest stays
        run: |
          for port in jq gsed; do
            if /opt/local/bin/port -q installed "$port" | grep -q .; then echo "port $port is still installed"; exit 1; fi
          done
          /opt/local/bin/port -q installed wget | grep -q .
          brew list --formula jq gnu-sed wget tree
      - name: Run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-ports-to-brew
          path: ~/Library/Application Support/brew-ports/runs/
          if-no-files-found: warn

  brew-to-ports:
    name: integration (brew to ports)
    needs: unit
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          tools/build-release.sh "$(uname -m)"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/brew-ports-*-macos-"$(uname -m)".tar.gz -C "$RUNNER_TEMP/bundle" --strip-components 1
          echo "$RUNNER_TEMP/bundle/bin" >> "$GITHUB_PATH"
      - name: Install MacPorts base
        run: brew-ports bootstrap-ports --yes
      - name: Mixed host
        run: |
          sudo /opt/local/bin/port -N -b install jq gsed wget
          brew install wget tree jq
      - name: plan
        run: brew-ports plan --target ports --only wget,tree --casks uninstall --yes --out plan.json
      - name: apply
        run: brew-ports apply plan.json --yes
      - name: The formulae are replaced, the rest stays
        run: |
          for formula in wget tree; do
            if brew list --formula "$formula" >/dev/null 2>&1; then echo "formula $formula is still installed"; exit 1; fi
          done
          brew list --formula jq
          for port in wget tree jq gsed; do /opt/local/bin/port -q installed "$port" | grep -q .; done
      - name: Run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-brew-to-ports
          path: ~/Library/Application Support/brew-ports/runs/
          if-no-files-found: warn

  # A full move: every port goes into the runner's Homebrew, and the plan then
  # uninstalls MacPorts itself, which empties it.
  full-move:
    name: integration (all of MacPorts into Homebrew)
    needs: unit
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          tools/build-release.sh "$(uname -m)"
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/brew-ports-*-macos-"$(uname -m)".tar.gz -C "$RUNNER_TEMP/bundle" --strip-components 1
          echo "$RUNNER_TEMP/bundle/bin" >> "$GITHUB_PATH"
      - name: Install MacPorts base
        run: brew-ports bootstrap-ports --yes
      - name: Ports
        run: sudo /opt/local/bin/port -N -b install jq gsed wget
      - name: plan
        run: brew-ports plan --target brew --yes --out plan.json
      - name: apply --dry-run
        run: brew-ports apply plan.json --dry-run
      - name: apply
        run: brew-ports apply plan.json --yes
      - name: verify
        run: brew-ports verify plan.json
      - name: MacPorts is gone, Homebrew holds the replacements
        run: |
          for path in /opt/local /Applications/MacPorts; do
            if [ -e "$path" ]; then echo "$path is still there"; ls -la "$path"; exit 1; fi
          done
          if dscl . -read /Users/macports >/dev/null 2>&1; then echo "the macports user is still there"; exit 1; fi
          brew list --formula jq gnu-sed wget
      - name: Run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-full-move
          path: ~/Library/Application Support/brew-ports/runs/
          if-no-files-found: warn
